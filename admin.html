<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — Étoile de Framboisier</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=mw8lzr9d">
  <link rel="stylesheet" href="css/editor.css?v=mw8lzr9d">
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="login-card">
      <img src="assets/favicon.png" alt="" width="72" height="72">
      <h1>Dashboard</h1>
      <p>Espace réservé à la gestion du site d'<em>Étoile de Framboisier</em>.</p>
      <button id="btn-login" class="btn primary" type="button">Se connecter avec Discord</button>
      <p id="login-msg" class="msg" role="alert"></p>
      <p><a href="index.html">← Retour au site</a></p>
    </div>
  </section>

  <div id="dash" hidden>
    <header class="top">
      <button id="btn-menu" class="btn small menu-btn" type="button" aria-label="Rubriques">☰</button>
      <strong class="brand">✦ Dashboard</strong>
      <span id="status" class="status clean">✓ Tout est enregistré</span>
      <span class="spacer"></span>
      <span id="who" class="who"></span>
      <a class="btn small" href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
      <button id="btn-undo" class="btn small" type="button" disabled title="Abandonner les modifications">Annuler</button>
      <button id="btn-save" class="btn small primary" type="button" disabled title="Ctrl + S">Enregistrer</button>
      <details class="more">
        <summary class="btn small" aria-label="Plus d'actions">⋯</summary>
        <div>
          <button id="btn-export" type="button">Exporter une sauvegarde (JSON)</button>
          <label for="file-import">Importer une sauvegarde…</label><input id="file-import" type="file" accept="application/json" hidden>
          <button id="btn-reset" type="button">Revenir au contenu par défaut</button>
          <button id="btn-logout" type="button">Se déconnecter</button>
        </div>
      </details>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div class="layout">
      <nav id="side" class="side" aria-label="Rubriques"></nav>
      <main class="main">
        <div class="sec-head"><h1 id="sec-title"></h1><p id="sec-help" class="sec-help"></p></div>
        <div id="editor" class="editor"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/outils.js?v=mw8lzr9d"></script>
  <script src="js/config.js?v=mw8lzr9d"></script>
  <script src="js/content.js?v=mw8lzr9d"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/admin.js?v=mw8lzr9d"></script>
</body>
</html>
